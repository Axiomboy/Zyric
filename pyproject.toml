[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyric"
version = "0.1.0"
description = "A new programming language built from scratch"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Axiomboy"}
]

[project.scripts]
zyric = "main:main"

[tool.setuptools]
py-modules = ["main"]
